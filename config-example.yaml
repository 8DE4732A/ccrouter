# ---------------------------------------------------------------------------
# 全局设置（可选）
# ---------------------------------------------------------------------------
# general:
#   admin_password: "your-admin-password"    # 设置管理页面访问密码；留空或不配则不开启认证
#   request_timeout_seconds: 600             # 请求超时时间（秒），0 为禁用超时
#   api_keys:                                # 客户端访问代理时必须携带的 Bearer Key
#     - key: "sk-router-xxxx-1"
#   proxy:
#     url: "http://127.0.0.1:7890"           # 全局出站代理

providers:
  # -----------------------------------------------------------------------
  # SenseNova：同一组 key 同时支持 OpenAI 和 Anthropic 两种格式
  # -----------------------------------------------------------------------
  - name: sensenova
    api:
      - api_format: openai          # → POST {base_url}/chat/completions
        base_url: "https://token.sensenova.cn/v1"
      - api_format: anthropic       # → POST {base_url}/messages
        base_url: "https://token.sensenova.cn/v1"
      - api_format: openai-images   # → POST {base_url}/images/generations
        base_url: "https://token.sensenova.cn/v1"
      - api_format: openai-embeddings # → POST {base_url}/embeddings
        base_url: "https://token.sensenova.cn/v1"
    max_retries: 3
    key_strategy: "fill-first"      # fill-first | round-robin
    keys:
      - key: "sk-sn-xxxx-1"
      - key: "sk-sn-xxxx-2"
    health_check_rules:
      # deepseek-v4-flash 的 5 小时额度限制（per key per model）
      - description: "quota_exceeded_flash"
        jsonpath: "$.error.type"
        match_value: "quota_exceeded_error"
        match_type: "equals"           # equals | contains | regex
        action: "rotate"
        cooldown_seconds: 18000        # 5 小时
        models: ["deepseek-v4-flash"]  # 空列表 = 适用所有模型
      # RPM 限速（适用所有模型，冷却 60 秒）
      - description: "rpm_exhausted"
        jsonpath: "$.error.message"
        match_value: "rpm exhausted"
        match_type: "contains"
        action: "rotate"
        cooldown_seconds: 60
        models: []

  # -----------------------------------------------------------------------
  # DeepSeek 官网：仅有 OpenAI Chat Completions 接口
  # 通过 upstream_api_format 可让 anthropic 格式的 combo 自动翻译转发到此 provider
  # -----------------------------------------------------------------------
  - name: deepseek
    api:
      - api_format: openai
        base_url: "https://api.deepseek.com/v1"
    max_retries: 3
    key_strategy: "round-robin"
    keys:
      - key: "sk-ds-xxxx-1"
    health_check_rules:
      - description: "rate_limit"
        jsonpath: "$.error.type"
        match_value: "rate_limit_exceeded"
        match_type: "equals"
        action: "rotate"
        cooldown_seconds: 60
        models: []

combos:
  # =======================================================================
  # 默认分组（owned_by: "default" 或 default: true）
  # 客户端请求直接使用 combo 名称，如 model="fast" 或 model="smart"（无前缀）
  # =======================================================================
  - owned_by: "default"
    default: true
    combos:
      # -------------------------------------------------------------------
      # 单格式 combo：仅接受 OpenAI Chat Completions 格式
      # -------------------------------------------------------------------
      - name: "fast"
        api_format: openai               # 单个字符串或列表均可
        strategy: "fill-first"           # fill-first 优先第一个 member，耗尽才切换
        members:
          - provider: sensenova
            model: "deepseek-v4-flash"
          - provider: deepseek           # sensenova 耗尽后的备用
            model: "deepseek-chat"

      # -------------------------------------------------------------------
      # 多格式 combo：同一 combo 名同时服务 openai 和 anthropic 请求
      # -------------------------------------------------------------------
      - name: "smart"
        api_format:
          - openai
          - anthropic
        strategy: "fill-first"
        members:
          - provider: sensenova
            model: "deepseek-v4-flash"
        aliases:
          - "deepseek-v4-flash"          # 客户端也可以用原始模型名访问

      # -------------------------------------------------------------------
      # 跨格式翻译 combo：combo 接受 anthropic 格式，但 provider 只有 openai 接口
      # -------------------------------------------------------------------
      - name: "fast-ant"
        api_format: anthropic
        strategy: "fill-first"
        members:
          - provider: deepseek
            model: "deepseek-chat"
            upstream_api_format: openai  # deepseek 只有 openai 端点，翻译后转发

      # -------------------------------------------------------------------
      # Responses API 格式 combo
      # -------------------------------------------------------------------
      - name: "fast-resp"
        api_format: openai-responses
        strategy: "fill-first"
        members:
          - provider: sensenova
            model: "deepseek-v4-flash"

      # -------------------------------------------------------------------
      # 图像生成与编辑 combo (配置 openai-images 自动支持 POST /v1/images/edits)
      # -------------------------------------------------------------------
      - name: "image"
        api_format: openai-images
        strategy: "fill-first"
        members:
          - provider: sensenova
            model: "sensenova-u1-fast"

      # -------------------------------------------------------------------
      # 向量嵌入 combo
      # -------------------------------------------------------------------
      - name: "embedding"
        api_format: openai-embeddings
        strategy: "fill-first"
        members:
          - provider: sensenova
            model: "text-embedding-3-small"

  # =======================================================================
  # 自定义命名空间分组（如 team-a）
  # 客户端请求必须使用 <owned_by>/<combo_name> 进行区分，如 model="team-a/fast"
  # /v1/models 会返回 id="team-a/fast", owned_by="team-a"
  # =======================================================================
  - owned_by: "team-a"
    combos:
      - name: "fast"
        api_format: openai
        strategy: "fill-first"
        members:
          - provider: deepseek
            model: "deepseek-chat"


# ---------------------------------------------------------------------------
# 详细日志记录与存储配置（可选）
# 记录包含完整请求体与响应体（含明文 API 密钥，仅限私有受信网络）
# 存储于 dir/requests.zrc，采用 zstd 字典链压缩并自动切片轮转
# ---------------------------------------------------------------------------
logging:
  enabled: false             # 是否启用详细记录（也可直接使用 verbose_logging: false）
  dir: "logs"                # 存储目录（相对或绝对路径，默认 logs）
  max_file_size_mb: 20       # 单个文件切片上限（MB），超出自动轮转（默认 20）
  max_backups: 10            # 历史切片保留数量上限，超出自动删除最旧切片（默认 10）
  compression_level: "best"  # zstd 压缩等级：fastest | default | better | best（默认 best）

# ---------------------------------------------------------------------------
# Payload 改写脚本列表（可选，默认为空）
# 脚本语言：expr-lang (https://expr-lang.org)
# 按顺序执行，前一个脚本的修改结果传给下一个；disabled 脚本自动跳过
# ---------------------------------------------------------------------------
payload_scripts:
  # -----------------------------------------------------------------------
  # 脚本 1：删除可能暴露客户端信息的 headers
  # -----------------------------------------------------------------------
  - name: "隐藏客户端标识"
    enabled: true
    script: |
      delh(headers, "user-agent")
      delh(headers, "x-client-version")
      del(body, "x_client_info")

  # -----------------------------------------------------------------------
  # 脚本 2：将 adaptive thinking 改写为 enabled（deepseek-v4-flash 专用）
  # -----------------------------------------------------------------------
  - name: "thinking_adaptive_to_enabled"
    enabled: true
    script: |
      combo == "smart" && "thinking" in body && "type" in body.thinking && body.thinking.type == "adaptive"
        ? setpath(body, "thinking", "type", "enabled")
        : nil

  # -----------------------------------------------------------------------
  # 脚本 3：对指定 combo 限制 thinking 预算（当前已禁用，方便复用时开启）
  # -----------------------------------------------------------------------
  - name: "fast combo 限制 thinking 预算"
    enabled: false
    script: |
      combo == "fast" && "thinking" in body
        ? setpath(body, "thinking", "budget_tokens", clamp(get(body.thinking, "budget_tokens", 8000), 0, 1024))
        : nil
